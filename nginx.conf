server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión básica para archivos estáticos.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Soporte de rutas de React Router (SPA):
    # cualquier ruta que no coincida con un archivo existente devuelve
    # index.html, para que React Router resuelva /dashboard, /login, etc.
    # sin producir un 404 al refrescar la página.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache más largo para assets versionados por Vite (hash en el nombre).
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
